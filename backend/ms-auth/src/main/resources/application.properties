server.port=8099
spring.application.name=ms-auth
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Sustituir JWT_SECRET en produccion por una clave Base64 aleatoria de al menos 32 bytes.
jwt.secret=${JWT_SECRET:/urSDUIrV3z7QBnshgjDKBw7+MgBEYIki+/z42yAm/E=}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.admin.email=${ADMIN_EMAIL:admin@logichat.com}
app.admin.password=${ADMIN_PASSWORD:123456}
